# The image is built in a chroot and booted on unknown virtual hardware, so it
# cannot use a host-only initramfs. A fully generic one is ~80 MiB compressed and
# ~330 MiB unpacked, which runs small VMs (512 MiB RAM) out of memory while the
# kernel unpacks it. Include only what a KVM guest needs to mount its root
# filesystem instead (most of these are built into the AOSC OS kernel anyway).
hostonly="no"
drivers="virtio_pci virtio_blk virtio_scsi ahci ata_piix sd_mod sr_mod nvme"
filesystems="ext4 vfat"
# Network/NFS root and measured-boot/token unlock are never used by this image.
omit_dracutmodules+=" network-manager network net-lib kernel-network-modules qemu-net nfs iscsi nbd fido2 pkcs11 tpm2-tss systemd-pcrextend "
