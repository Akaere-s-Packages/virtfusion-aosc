# Cloud image defaults for systemd-resolved:
# - DNSSEC: AOSC OS defaults to allow-downgrade, which hard-fails ("no-signature")
#   behind upstream resolvers that strip DNSSEC records, e.g. many provider DNS servers.
# - LLMNR/mDNS: never broadcast the hostname or listen on 5355 on a public VPS NIC.
[Resolve]
DNSSEC=no
LLMNR=no
MulticastDNS=no
