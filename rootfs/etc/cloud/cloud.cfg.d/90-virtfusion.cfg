# VirtFusion provides NoCloud or ConfigDrive v2 seeds; skip probing anything else.
datasource_list: [NoCloud, ConfigDrive, None]

# VirtFusion customers log in as root with the panel-provided password/SSH keys.
disable_root: false
ssh_pwauth: true

system_info:
  network:
    renderers: [network-manager]
    activators: [network-manager]
